android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.enableR8.fullMode=true


# --- NATIVE CODE BUILD OPTIMIZATION ---
# Building native C/C++ code can be extremely slow (10+ minutes on older hardware).
#
# buildNative = true  -> Full CMake build (slow, use only when changing C/C++ code).
# buildNative = false -> Skip CMake, use precompiled libraries (fast, ~6 seconds).
#
# If you set this to 'false', ensure you have precompiled .so files in:
# [ProjectRoot]/TMessagesProj/src/main/compiledJniLibs
#
# To generate/update these libraries:
# 1. Run: `./gradlew :TMessagesProj:assembleDebug -PbuildNative=true`
# 2. Copy files from:
#    TMessagesProj/build/intermediates/stripped_native_libs/debug/stripDebugDebugSymbols/out/lib/*
# 3. Paste to:
#    TMessagesProj/src/main/compiledJniLibs/
# ---------------------------------------
buildNative=false