APP_VERSION_CODE=6580
APP_VERSION_NAME=12.5.1
APP_PACKAGE=org.telegear.messenger
IS_PRIVATE=false
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android
